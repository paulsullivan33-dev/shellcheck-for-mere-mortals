site_name: ShellCheck for Mere Mortals
site_description: Plain-language linting of shell scripts. Reading ShellCheck reports, quoting and word splitting, star and at, tests that lie, dialects and severity, silencing with a paper trail, and gates that refuse faulty scripts, practised on a lab of everyday scripts with planted faults.
site_url: https://paulsullivan33-dev.github.io/shellcheck-for-mere-mortals/

